<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="980" height="220" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.1">
    <line x1="10" y1="65" x2="990" y2="65" />
    <line x1="10" y1="120" x2="990" y2="120" />
    <line x1="10" y1="175" x2="990" y2="175" />
    <line x1="200" y1="10" x2="200" y2="230" />
    <line x1="500" y1="10" x2="500" y2="230" />
    <line x1="800" y1="10" x2="800" y2="230" />
  </g>

  <!-- Icon / Visual Accent -->
  <g transform="translate(60, 60)">
    <circle cx="60" cy="60" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="60" cy="60" r="36" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" />
    <path d="M44 62 L54 72 L76 48" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Typography -->
  <text x="200" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#textGradient)" letter-spacing="-0.5">
    Offline Productivity Desktop
  </text>
  <text x="200" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Local-First Task Engineering · Timeboxing · Focus Telemetry HUD
  </text>

  <!-- Tag Pills -->
  <g transform="translate(200, 162)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="52" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">OFFLINE-FIRST</text>

    <rect x="115" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="165" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">LOCAL SQLITE</text>

    <rect x="225" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="282" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">OBS WEBSOCKET</text>

    <rect x="350" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="397" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">NO TELEMETRY</text>
  </g>
</svg>

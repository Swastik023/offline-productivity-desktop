<focus-mode-layout>
  <!-- ========== ROW 2: Task module ========== -->
  <div
    fmTask
    class="task-section"
  >
    <focus-mode-task-row
      [task]="currentTask() ?? null"
      [relaxMessageKey]="T.F.FOCUS_MODE.BREAK_RELAX_MSG"
      (switchTask)="openTaskSelector()"
      (finishTask)="finishCurrentTask()"
      (titleEdited)="updateTaskTitle($event.wasChanged, $event.newVal)"
    ></focus-mode-task-row>
  </div>

  <!-- ========== ROW 3: Message / Clock area ========== -->
  <div
    fmClock
    class="clock-display"
  >
    <div class="message-wrapper">
      <h2 class="title">{{ T.F.FOCUS_MODE.BREAK_FINISHED | translate }}</h2>

      @if (isPomodoro()) {
        <div class="cycle-counter">
          <mat-icon>repeat</mat-icon>
          {{ T.F.FOCUS_MODE.POMODORO_CYCLE | translate: { cycle: displayedCycle() } }}
        </div>
      }

      <div class="subtitle">{{ T.F.FOCUS_MODE.WAITING_FOR_NEXT_FOCUS | translate }}</div>
    </div>
  </div>

  <!-- ========== ROW 4: Primary actions ========== -->
  <section
    fmBottom
    class="bottom-controls"
  >
    <button
      mat-icon-button
      class="exit-btn"
      [attr.aria-label]="T.F.FOCUS_MODE.BACK_TO_PLANNING | translate"
      [matTooltip]="T.F.FOCUS_MODE.BACK_TO_PLANNING | translate"
      (click)="exitToPlanning()"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>

    <button
      mat-raised-button
      color="primary"
      class="start-focus-btn"
      id="focus-mode-waiting-start-btn"
      [attr.aria-label]="T.F.FOCUS_MODE.START_NEXT_FOCUS_SESSION | translate"
      (click)="startNextFocus()"
    >
      <mat-icon>play_arrow</mat-icon>
      {{ T.F.FOCUS_MODE.START_NEXT_FOCUS_SESSION | translate }}
    </button>
  </section>
</focus-mode-layout>

@if (isTaskSelectorOpen()) {
  <focus-mode-task-selector
    (taskSelected)="switchTask($event)"
    (closeSelector)="closeTaskSelector()"
  ></focus-mode-task-selector>
}
